<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="bg4" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#F0FDF4"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient><linearGradient id="brand4" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10B981"/></linearGradient><filter id="soft4" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#065F46" flood-opacity=".12" stdDeviation="16"/></filter></defs><rect width="800" height="600" fill="url(#bg4)"/><circle cx="120" cy="90" r="120" fill="#10B981" opacity=".05"/><circle cx="700" cy="520" r="140" fill="#34D399" opacity=".06"/><text x="64" y="84" fill="#065F46" font-family="Arial, sans-serif" font-size="32" font-weight="700">Agentic RAG</text><text x="64" y="116" fill="#059669" font-family="Arial, sans-serif" font-size="15">A ReAct-style agent that reasons, calls tools and iterates over multiple steps</text><g filter="url(#soft4)"><rect width="672" height="396" x="64" y="148" fill="#FFF" rx="20"/></g><g transform="translate(300, 176)"><rect width="200" height="44" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" rx="12"/><text x="100" y="28" fill="#065F46" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">User Question</text></g><path stroke="#059669" stroke-width="2.5" marker-end="url(#arrG4)" d="M400 220 V244"/><g transform="translate(120, 250)"><rect width="560" height="208" fill="#FAF5FF" stroke="#C4B5FD" stroke-dasharray="9 5" stroke-width="2" rx="16"/><rect width="120" height="26" x="20" y="-1" fill="#8B5CF6" rx="13"/><text x="80" y="17" fill="#FFF" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ReAct Loop</text><g transform="translate(36, 48)"><rect width="216" height="120" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5" rx="12"/><text x="108" y="32" fill="#5B21B6" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1. Reasoning</text><text x="108" y="62" fill="#6B21A8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Analyze the question</text><text x="108" y="86" fill="#6B21A8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Plan the next action</text></g><path stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrP4)" d="M256 108 H300"/><g transform="translate(308, 36)"><rect width="216" height="144" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.5" rx="12"/><text x="108" y="30" fill="#92400E" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2. Acting (Tools)</text><g fill="#78350F" font-family="Arial, sans-serif" font-size="12.5" text-anchor="middle"><rect width="176" height="28" x="20" y="44" fill="#FFF" stroke="#FDE68A" rx="8"/><text x="108" y="63">Vector Search</text><rect width="176" height="28" x="20" y="78" fill="#FFF" stroke="#FDE68A" rx="8"/><text x="108" y="97">Knowledge Graph</text><rect width="176" height="28" x="20" y="112" fill="#FFF" stroke="#FDE68A" rx="8"/><text x="108" y="131">Web Search</text></g></g><path fill="none" stroke="#8B5CF6" stroke-dasharray="5 4" stroke-width="2.5" marker-end="url(#arrP4)" d="M416 180 Q 300 206 150 170"/><text x="280" y="204" fill="#7C3AED" font-family="Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Observe results · iterate</text></g><path stroke="#059669" stroke-width="2.5" marker-end="url(#arrG4)" d="M400 458 V482"/><g transform="translate(250, 488)"><rect width="300" height="46" fill="url(#brand4)" filter="url(#soft4)" rx="14"/><text x="150" y="30" fill="#FFF" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3. Grounded, cited answer</text></g><defs><marker id="arrG4" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="3"><polygon fill="#059669" points="0 0 9 3 0 6"/></marker><marker id="arrP4" markerHeight